services:
  postgres:
    image: postgres:17-alpine
    container_name: my-postgres-17
    restart: always
    environment:
      POSTGRES_USER: autogen_pln
      POSTGRES_PASSWORD: 1221425pg
      POSTGRES_DB: autogen_prod
      TZ: Asia/Jakarta
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  postgres_data:
networks:
  app-network:
    driver: bridge